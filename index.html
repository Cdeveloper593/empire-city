<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EMPIRE CITY — one small city, one whole day</title>
  <meta name="description" content="Scroll to fly through EMPIRE CITY, a miniature New York City, from dawn to the night skyline." />
  <meta name="theme-color" content="#F2E8D5" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F2E8D5'/%3E%3Cpath d='M12 52V30h12v22h4V20h6V10h4v10h6v32h4V36h8v16Z' fill='%233A6EA5'/%3E%3C/svg%3E" />
  <style>
    :root, .sw-root {
      --sw-bg: #F2E8D5;
      --sw-ink: #252D38;
      --sw-ink-soft: #5B6572;
      --sw-accent: #3A6EA5;
      --sw-font-display: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --sw-font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .sw-root.sw-night{--sw-ink:#F4EEE2;--sw-ink-soft:#B9C0D8}
    /* Brand mark: Empire State Building silhouette (overrides the engine's blob) */
    .sw-brand__mark{
      border-radius:0;
      box-shadow:none;
      background:linear-gradient(180deg,var(--sw-accent),color-mix(in srgb,var(--sw-accent) 55%,#000));
      -webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2028%27%3E%3Cpath%20d%3D%27M11.6%200h0.8v3.2l0.8%202.2v1.2h1.4v3.8h1.8v3.8h2v4.4h2.2V28H3.4v-9.4h2.2v-4.4h2v-3.8h1.8V6.6h1.4V5.4l0.8-2.2z%27%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;
      mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2028%27%3E%3Cpath%20d%3D%27M11.6%200h0.8v3.2l0.8%202.2v1.2h1.4v3.8h1.8v3.8h2v4.4h2.2V28H3.4v-9.4h2.2v-4.4h2v-3.8h1.8V6.6h1.4V5.4l0.8-2.2z%27%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;
      filter:drop-shadow(0 4px 7px color-mix(in srgb,var(--sw-accent) 35%,transparent));
    }
    body { margin: 0; background: var(--sw-bg); }
    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <h1 class="visually-hidden">EMPIRE CITY — one small city, one whole day</h1>
  <div id="world"></div>
  <div id="finale"></div>
  <noscript>
    <div style="max-width:640px;margin:8vh auto;padding:0 20px;text-align:center;font-family:system-ui,sans-serif;color:#252D38;">
      <img src="assets/scene1.webp" alt="A miniature Manhattan at dawn" style="width:100%;border-radius:16px;" />
      <p style="font-size:1.1rem;line-height:1.6;">EMPIRE CITY is a scroll-driven flight through a miniature New York City, from dawn to night. It needs JavaScript enabled to fly — please turn it on and scroll.</p>
    </div>
  </noscript>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'EMPIRE CITY', href: '#top' },
      cta: { label: 'Start your world', href: '#finale' },
      hint: 'scroll to fly in',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        {
          id: 'arrival', label: 'The Arrival',
          still: 'assets/scene1.webp',
          clip: 'assets/vid/scene1.mp4',
          accent: '#3A6EA5',
          eyebrow: 'DAWN',
          title: 'One small city, one whole day.',
          body: 'A miniature Manhattan wakes up — ferries out, taxis rolling, the towers still gold.',
          tags: ['Miniature diorama', 'Dawn'],
          scroll: 1.6, linger: 0.45,
        },
        {
          id: 'central-park', label: 'Central Park',
          still: 'assets/scene2.webp',
          clip: 'assets/vid/scene2.mp4',
          accent: '#5A8A4A',
          eyebrow: 'MORNING',
          title: 'A park in the middle of everything.',
          body: 'Rowboats on the lake, the bow bridge in the trees, and the skyline standing guard.',
          tags: ['Bow Bridge', 'The Lake'],
        },
        {
          id: 'brooklyn-bridge', label: 'Brooklyn Bridge',
          still: 'assets/scene3.webp',
          clip: 'assets/vid/scene3.mp4',
          accent: '#B55232',
          eyebrow: 'GOLDEN AFTERNOON',
          title: 'Walk the cables home.',
          body: 'Stone towers, a web of cables, and DUMBO rooftops waiting on the other side.',
          tags: ['Since 1883', 'DUMBO'],
        },
        {
          id: 'times-square', label: 'Times Square',
          still: 'assets/scene4.webp',
          clip: 'assets/vid/scene4.mp4',
          accent: '#F2B705',
          eyebrow: 'DUSK',
          title: 'The lights come on early here.',
          body: 'Billboards warming up, marquees lit, and a river of yellow cabs below.',
          tags: ['Broadway', 'Yellow cabs'],
        },
        {
          id: 'skyline-night', label: 'The Night Skyline',
          still: 'assets/scene5.webp',
          clip: 'assets/vid/scene5.mp4',
          accent: '#FFB347', dark: true,
          eyebrow: 'AFTER DARK',
          title: 'Ten thousand lit windows.',
          body: 'The towers trade daylight for lamplight, and the ferry draws a line of gold on the water.',
          tags: ['One WTC', 'Night ferry'],
        },
        {
          id: 'finale', label: 'Your World Next',
          still: 'assets/scene6.webp',
          clip: 'assets/vid/scene6.mp4',
          accent: '#FFB347', dark: true,
          eyebrow: 'YOUR WORLD NEXT',
          title: 'Every brand deserves a world.',
          body: 'This one was built in a day of scrolling. Yours could be next.',
          tags: [],
          scroll: 1.6, linger: 0.45,
          cta: { primary: { label: 'Start your world', href: 'https://cerium-web-development.vercel.app/' },
                 secondary: { label: 'Back to dawn', href: '#top' } },
        },
      ],
      connectors: [
        'assets/vid/conn1.mp4',
        'assets/vid/conn2.mp4',
        'assets/vid/conn3.mp4',
        'assets/vid/conn4.mp4',
        'assets/vid/conn5.mp4',
      ],
    });
  </script>
</body>
</html>
